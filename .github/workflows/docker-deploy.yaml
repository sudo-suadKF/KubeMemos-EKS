name: Docker Build & Deploy

on:
  push:
    branches: [main]
    paths:
      -  'memos/**'
  pull_request:
    branches: [main]
    paths:
      - 'memos/**'
  workflow_dispatch:
    inputs:
      action:
        description: "Type 'Deploy' to build and deploy Docker"
        required: true
        type: string
        default: ''

env:
  AWS_REGION: eu-west-2
  CLUSTER_NAME: my-eks-cluster
  DOCKER_DIR: ./memos

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  lint:
    name: Linting Dockerfile
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.DOCKER_DIR }}
    steps:
      - uses: actions/checkout@v6

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          ignore: DL3018
          no-color: true
          output-file: hadolint.sarif

      - name: Upload Hadolint Results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.DOCKER_DIR }}/hadolint.sarif
          category: hadolint
          wait-for-processing: true

  secret-scan:
    name: Scanning Secrets
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Trivy Secrets Scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'repo'
          scan-ref: '${{ env.DOCKER_DIR }}'
          scanners: 'secret'
          format: 'sarif'
          output: 'trivy-secret-memos-results.sarif'

      - name: Upload Trivy Secrets Scan
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-secret-memos-results.sarif'
          category: 'trivy-secret-memos-scan'
          wait-for-processing: true
