name: Docker Build & Deploy

on:
  push:
    branches: [main]
    paths:
      -  'memos/**'
  pull_request:
    branches: [main]
    paths:
      - 'memos/**'
  workflow_dispatch:
    inputs:
      action:
        description: "Type 'Deploy' to build and deploy Docker"
        required: true
        type: string
        default: ''

env:
  AWS_REGION: eu-west-2
  CLUSTER_NAME: my-eks-cluster
  DOCKER_DIR: ./memos

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
