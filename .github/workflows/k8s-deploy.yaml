name: K8s-deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  CLUSTER_NAME: my-eks-cluster
  K8s_DIR: ./kubernetes
  ARGO_CD_DIR: ./argo-cd
  MONITORING_DIR: ./monitoring
  PROMETHEUS_DIR: ./monitoring/prometheus
  GRAFANA_DIR: ./monitoring/grafana

jobs:
  check:
    name: Check if Production Exists
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.K8s_DIR }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set Up Kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'latest'

      - name: Set Up Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'

      - name: Set Up Helm-diff
        run: helm plugin install https://github.com/databus23/helm-diff

      - name: Set Up Helmfile
        run: |
          curl -LO https://github.com/helmfile/helmfile/releases/download/v1.5.5/helmfile_1.5.5_linux_amd64.tar.gz
          tar xzf helmfile_1.5.5_linux_amd64.tar.gz
          sudo mv helmfile /usr/local/bin/

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Check if Production Exists
        id: check
        run: |
          if kubectl get ns production; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply Helmfile
        if: steps.check.outputs.exists == 'true'
        run: helmfile apply

      - name: Exit Pipeline
        if: steps.check.outputs.exists == 'false'
        run: exit 1
